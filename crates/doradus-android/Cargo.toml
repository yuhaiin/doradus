[package]
name = "doradus-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
tokio = { version = "1.50.0", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
doradus-api = { path = "../doradus-api" }
doradus-runtime = { path = "../doradus-runtime" }
doradus-tun = { path = "../doradus-tun" }

[lints.rust]
unsafe_code = "allow"
