[package]
name = "yuhaiin-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tun = ["dep:tun-rs"]

[dependencies]
tun-rs = { version = "2.8.8", optional = true, default-features = false, features = ["async_io"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["net"] }
netlink-packet-core = "0.8.2"
netlink-packet-route = "0.31.0"
netlink-sys = "0.8.8"

# This crate is the deliberately tiny platform/unsafe boundary.  The rest of
# the workspace keeps unsafe_code=forbid; only this adapter may call the
# dependency's raw-fd constructor after validating ownership with OwnedFd.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
