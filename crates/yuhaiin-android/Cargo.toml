[package]
name = "yuhaiin-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
tokio = { version = "1.50.0", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
yuhaiin-api = { path = "../yuhaiin-api" }
yuhaiin-runtime = { path = "../yuhaiin-runtime" }
yuhaiin-tun = { path = "../yuhaiin-tun" }

[lints.rust]
unsafe_code = "allow"
