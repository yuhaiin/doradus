[package]
name = "doradus-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tun-fakeip-smoke = [
    "dep:bytes",
    "dep:h2",
    "dep:http",
    "dep:smoltcp",
    "dep:tokio",
    "doradus-core/http2",
    "dep:doradus-tun",
    "dep:doradus-protocol",
]
sqlite-rusqlite-probe = []

[dependencies]
base64 = "0.22.1"
blake3 = { version = "1.8.6", default-features = false, features = ["std", "pure"] }
bytes = { version = "1.12.1", optional = true }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
h2 = { version = "0.4.15", optional = true }
http = { version = "1.5.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.11.0", default-features = false }
smoltcp = { version = "0.13.1", optional = true, default-features = false, features = ["std", "medium-ip", "proto-ipv4"] }
tokio = { version = "1.50.0", optional = true, default-features = false, features = ["io-util", "rt", "sync", "time"] }
doradus-core = { path = "../doradus-core" }
doradus-dns = { path = "../doradus-dns" }
doradus-protocol = { path = "../doradus-protocol", features = ["quic"], optional = true }
doradus-tun = { path = "../doradus-tun", optional = true }
rusqlite = { version = "0.39.0", features = ["bundled"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.50.0", default-features = false, features = ["macros", "rt", "time"] }

[[bin]]
name = "tun-fakeip-smoke"
path = "src/bin/tun_fakeip_smoke.rs"
required-features = ["tun-fakeip-smoke"]

[[bin]]
name = "sqlite_backend_probe"
path = "src/bin/sqlite_backend_probe.rs"
required-features = ["sqlite-rusqlite-probe"]
