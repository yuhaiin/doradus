[package]
name = "doradus-geo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maxminddb = { version = "0.30.0", features = ["mmap"] }
memmap2 = "0.9"
sha2 = { version = "0.11.0", default-features = false }
doradus-core = { path = "../doradus-core" }

# Mapping an immutable GeoIP index is the deliberate unsafe boundary in this
# crate; memmap2 performs the platform-specific mapping operation.
[lints.rust]
unsafe_code = "allow"
