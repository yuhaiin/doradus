[package]
name = "doradus-backup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
hmac = { version = "0.12.1", default-features = false }
http = "1.5.0"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
rustls = { version = "0.23.41", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = { version = "0.11.0", default-features = false }
sha2_10 = { package = "sha2", version = "0.10.9", default-features = false }
time = { version = "0.3.44", features = ["formatting", "macros"] }
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "net", "rt", "time"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.149"
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
