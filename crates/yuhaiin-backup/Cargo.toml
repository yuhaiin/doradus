[package]
name = "yuhaiin-backup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hmac = { version = "0.12.1", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23.41", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = { version = "0.11.0", default-features = false }
sha2_10 = { package = "sha2", version = "0.10.9", default-features = false }
time = { version = "0.3.44", features = ["formatting", "macros"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.149"
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
