[package]
name = "yuhaiin-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
http2 = ["yuhaiin-dns/http2"]
async-proxy = ["dep:futures-util", "dep:tokio", "yuhaiin-dns/async-proxy"]
tls-rustcrypto = []

[dependencies]
futures-util = { version = "0.3.33", optional = true, default-features = false, features = ["std"] }
socket2 = { version = "0.6.5", default-features = false, features = ["all"] }
tokio = { version = "1.50.0", optional = true, default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
yuhaiin-dns = { path = "../yuhaiin-dns" }
yuhaiin-types = { path = "../yuhaiin-types" }

[[bin]]
name = "nat-worker"
path = "src/bin/nat_worker.rs"

[lints]
workspace = true
