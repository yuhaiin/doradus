[package]
name = "yuhaiin-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
http = ["yuhaiin-dns/http"]
# Compatibility alias for callers that used the previous HTTP/2-only name.
http2 = ["http"]
tls-ring = []
# Compatibility alias for callers using the former provider feature name.
tls-rustcrypto = ["tls-ring"]

[dependencies]
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
socket2 = { version = "0.6.5", default-features = false, features = ["all"] }
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
yuhaiin-dns = { path = "../yuhaiin-dns" }
yuhaiin-types = { path = "../yuhaiin-types" }

[[bin]]
name = "nat-worker"
path = "src/bin/nat_worker.rs"

[lints]
workspace = true
