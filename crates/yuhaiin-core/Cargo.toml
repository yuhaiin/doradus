[package]
name = "yuhaiin-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
http2 = ["dep:bytes", "dep:futures-util", "dep:h2", "dep:http", "dep:tokio"]
async-proxy = ["dep:futures-util", "dep:hickory-resolver", "dep:tokio"]
tls-rustcrypto = ["dep:rustls", "dep:rustls-rustcrypto"]
tun = ["dep:futures-lite", "dep:smoltcp", "dep:yuhaiin-platform"]
tun-routes = ["tun", "dep:route_manager"]
websocket = ["async-proxy", "dep:tokio-tungstenite"]

[dependencies]
bytes = { version = "1.12.1", optional = true }
futures-util = { version = "0.3.33", optional = true, default-features = false, features = ["std"] }
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
h2 = { version = "0.4.15", optional = true }
http = { version = "1.5.0", optional = true }
futures-lite = { version = "2.6.1", optional = true }
rustls = { version = "0.23.41", optional = true, default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true, default-features = false, features = ["std", "tls12", "zeroize"] }
sha2 = { version = "0.11.0", default-features = false }
socket2 = { version = "0.6.5", default-features = false, features = ["all"] }
smoltcp = { version = "0.13.1", optional = true, default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv4-fragmentation", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp", "async", "iface-max-addr-count-8"] }
tokio = { version = "1.50.0", optional = true, default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", optional = true, default-features = false, features = ["handshake"] }
yuhaiin-platform = { path = "../yuhaiin-platform", optional = true, features = ["tun"] }

[[bin]]
name = "tun-smoke"
path = "src/bin/tun_smoke.rs"
required-features = ["tun"]

[[bin]]
name = "nat-worker"
path = "src/bin/nat_worker.rs"

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
route_manager = { version = "0.2.13", optional = true, default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
hickory-resolver = { version = "0.26.1", optional = true, default-features = false, features = ["system-config", "tokio"] }
