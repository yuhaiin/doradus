[package]
name = "yuhaiin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["tun", "tun-routes", "doh-tls", "websocket", "http-termination"]
# Kept as an empty compatibility feature for callers that used
# `--features http-api` while the management host still lived here. The HTTP
# implementation now belongs to yuhaiin-api.
http-api = []
update = ["dep:futures-util", "dep:reqwest", "dep:rustls", "dep:rustls-rustcrypto", "dep:webpki-roots"]
http2 = ["dep:bytes", "dep:h2", "dep:http", "yuhaiin-core/http2"]
http-termination = [
    "doh-tls",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "hyper/client",
    "hyper/http1",
    "hyper/server",
    "hyper/http2",
    "hyper-util/server-auto",
    "hyper-util/tokio",
]
tun = ["yuhaiin-tun/async-proxy"]
tun-routes = ["tun", "yuhaiin-tun/tun-routes"]
doh-tls = [
    "http2",
    "dep:rustls",
    "dep:rustls-rustcrypto",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "dep:x509-cert",
    "dep:p256-tls-auto",
    "dep:sha2_10",
    "dep:ed25519-tls-auto",
    "dep:rsa-tls-auto",
    "dep:signature-tls-auto",
    "yuhaiin-protocol/tls-rustcrypto",
    "dep:webpki-roots",
    "yuhaiin-dns/tls",
    "yuhaiin-dns/quic",
]
websocket = [
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "yuhaiin-protocol/websocket",
]

[dependencies]
base64 = "0.22.1"
blake2 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
bytes = { version = "1.12.1", optional = true }
futures-util = { version = "0.3.33", optional = true, default-features = false, features = ["std"] }
h2 = { version = "0.4.15", optional = true }
http-body-util = { version = "0.1.4", optional = true }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.44", features = ["formatting", "local-offset", "parsing"] }
http = { version = "1.5.0", optional = true }
hyper = { version = "1.11.0", default-features = false, optional = true }
hyper-util = { version = "0.1.20", default-features = false, optional = true }
rustls = { version = "0.23.41", optional = true, default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true, default-features = false, features = ["std", "tls12", "zeroize"] }
rustls-pemfile = { version = "2.2.0", optional = true }
p256-tls-auto = { package = "p256", version = "0.13.2", optional = true, default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
sha2_10 = { package = "sha2", version = "0.10.9", optional = true, features = ["oid"] }
x509-cert = { version = "0.2.5", optional = true, default-features = false, features = ["builder", "std"] }
ed25519-tls-auto = { package = "ed25519-dalek", version = "2.2.0", optional = true, default-features = false, features = ["std", "pkcs8"] }
rsa-tls-auto = { package = "rsa", version = "0.9.10", optional = true, default-features = false, features = ["std", "pem", "sha2"] }
signature-tls-auto = { package = "signature", version = "2.2.0", optional = true, default-features = false, features = ["alloc", "rand_core"] }
tokio = { version = "1.50.0", default-features = false, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
webpki-roots = { version = "1.0.3", optional = true }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["tls12"] }
tokio-tungstenite = { version = "0.28.0", optional = true, default-features = false, features = ["handshake"] }
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }
rand = { version = "0.10.2", default-features = false, features = ["std", "thread_rng"] }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
yuhaiin-chain = { path = "../yuhaiin-chain" }
yuhaiin-dns = { path = "../yuhaiin-dns", features = ["async-proxy"] }
yuhaiin-core = { path = "../yuhaiin-core", features = ["async-proxy"] }
yuhaiin-geo = { path = "../yuhaiin-geo" }
yuhaiin-protocol = { path = "../yuhaiin-protocol" }
yuhaiin-store = { path = "../yuhaiin-store", features = ["async-dns"] }
yuhaiin-tun = { path = "../yuhaiin-tun" }
yuhaiin-trie = { path = "../yuhaiin-trie", features = ["async-proxy"] }
yuhaiin-wireguard = { path = "../yuhaiin-wireguard" }
yuhaiin-platform = { path = "../yuhaiin-platform" }
socket2 = { version = "0.6.5", features = ["all"] }

[lints]
workspace = true

[[bin]]
name = "tun-service-smoke"
path = "src/bin/tun_service_smoke.rs"
required-features = ["tun"]

[[bin]]
name = "transparent-service-smoke"
path = "src/bin/transparent_service_smoke.rs"
required-features = []

[dev-dependencies]
boringtun = { version = "0.7.1", default-features = false }
bytes = "1.12.1"
h2 = "0.4.15"
http = "1.5.0"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
tower = { version = "0.5.2", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["net", "uio", "process", "signal"] }
netlink-packet-core = "0.8.2"
netlink-packet-route = "0.31.0"
netlink-sys = "0.8.8"

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15.0", default-features = false, features = ["prost-codec"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.0"
