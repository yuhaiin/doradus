[package]
name = "yuhaiin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["http-api", "tun", "tun-routes", "doh-tls", "websocket"]
http-api = ["dep:axum", "dep:tower-http", "dep:tokio-stream", "tokio/signal", "tokio/rt-multi-thread"]
http2 = ["dep:bytes", "dep:h2", "dep:http", "yuhaiin-core/http2"]
tun = ["yuhaiin-core/tun"]
tun-routes = ["tun", "yuhaiin-core/tun-routes"]
doh-tls = [
    "http2",
    "dep:rustls",
    "dep:rustls-rustcrypto",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "yuhaiin-core/tls-rustcrypto",
    "yuhaiin-protocol/tls-rustcrypto",
    "dep:webpki-roots",
]
websocket = [
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "yuhaiin-core/websocket",
    "yuhaiin-protocol/websocket",
]

[dependencies]
base64 = "0.22.1"
sha2 = { version = "0.11.0", default-features = false }
bytes = { version = "1.12.1", optional = true }
futures-util = { version = "0.3.33", optional = true, default-features = false, features = ["std"] }
h2 = { version = "0.4.15", optional = true }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.44", features = ["formatting", "parsing"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
tower-http = { version = "0.6.6", default-features = false, features = ["cors"], optional = true }
tokio-stream = { version = "0.1.17", features = ["sync"], optional = true }
http = { version = "1.5.0", optional = true }
rustls = { version = "0.23.41", optional = true, default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true, default-features = false, features = ["std", "tls12", "zeroize"] }
rustls-pemfile = { version = "2.2.0", optional = true }
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
webpki-roots = { version = "1.0.3", optional = true }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["tls12"] }
tokio-tungstenite = { version = "0.28.0", optional = true, default-features = false, features = ["handshake"] }
yuhaiin-chain = { path = "../yuhaiin-chain" }
yuhaiin-core = { path = "../yuhaiin-core", features = ["async-proxy"] }
yuhaiin-geo = { path = "../yuhaiin-geo" }
yuhaiin-protocol = { path = "../yuhaiin-protocol" }
yuhaiin-store = { path = "../yuhaiin-store", features = ["async-dns"] }
yuhaiin-trie = { path = "../yuhaiin-trie", features = ["async-proxy"] }

[lints]
workspace = true

[[bin]]
name = "yuhaiin"
path = "src/bin/yuhaiin.rs"
required-features = ["http-api"]

[dev-dependencies]
h2 = "0.4.15"
http-body-util = "0.1.4"
tower = { version = "0.5.2", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.8.2"
netlink-packet-route = "0.31.0"
netlink-sys = "0.8.8"
