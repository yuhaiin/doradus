[package]
name = "yuhaiin-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "std"] }
aes = { version = "0.8.4", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["std"] }
chacha20 = { version = "0.9.1", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "pkcs8"] }
crc32fast = { version = "1.5.0", default-features = false }
hmac = { version = "0.12.1", default-features = false }
hkdf = { version = "0.12.4", default-features = false }
md-5 = { version = "0.10.6", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "ecdsa", "pem", "pkcs8", "std"] }
rand = { version = "0.10.2", default-features = false, features = ["std", "thread_rng"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
http-body-util = "0.1.4"
hyper = { version = "1.11.0", default-features = false, features = ["client", "http2", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
http = "1.5.0"
sha2 = { version = "0.11.0", default-features = false }
sha2_10 = { package = "sha2", version = "0.10.9", default-features = false, features = ["oid"] }
sha1 = { version = "0.10.7", default-features = false }
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
yuhaiin-core = { path = "../yuhaiin-core" }
yuhaiin-types = { path = "../yuhaiin-types" }
rustls = { version = "0.23.41", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"] }
tokio-tungstenite = { version = "0.28.0", optional = true, default-features = false, features = ["handshake"] }
socket2 = { version = "0.6.5", features = ["all"] }
serde_json = "1.0.149"
rsa-tls-auto = { package = "rsa", version = "0.9.10", optional = true, default-features = false, features = ["std", "pem", "sha2"] }
signature-tls-auto = { package = "signature", version = "2.2.0", optional = true, default-features = false, features = ["alloc", "rand_core"] }
rustls-pemfile = { version = "2.2.0", optional = true }
x509-cert = { version = "0.2.5", optional = true, default-features = false, features = ["builder", "std"] }
quinn = { version = "0.11.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }
webpki-roots = { version = "1.0.3", optional = true }

[features]
default = []
tls-ring = [
    "dep:rsa-tls-auto",
    "dep:rustls-pemfile",
    "dep:signature-tls-auto",
    "dep:x509-cert",
]
# Compatibility alias for callers using the former provider feature name.
tls-rustcrypto = ["tls-ring"]
websocket = ["dep:tokio-tungstenite"]
quic = ["dep:quinn", "dep:webpki-roots"]

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["net", "uio"] }

[dev-dependencies]
# Raw peer used only to exercise Hyper's HTTP/2 CONNECT interoperability;
# production client/server code uses Hyper directly.
criterion = "0.5.1"
h2 = "0.4.15"
rustls-pemfile = "2.2.0"

[[bench]]
name = "quic"
harness = false

[lints]
workspace = true
