[package]
name = "yuhaiin-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "std"] }
aes = { version = "0.8.4", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["std"] }
chacha20 = { version = "0.9.1", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
crc32fast = { version = "1.5.0", default-features = false }
hmac = { version = "0.12.1", default-features = false }
hkdf = { version = "0.12.4", default-features = false }
md-5 = { version = "0.10.6", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "std"] }
rand = { version = "0.10.2", default-features = false, features = ["std", "thread_rng"] }
futures-util = { version = "0.3.33", optional = true, default-features = false, features = ["std", "sink"] }
sha2 = { version = "0.11.0", default-features = false }
sha2_10 = { package = "sha2", version = "0.10.9", default-features = false }
sha1 = { version = "0.10.7", default-features = false }
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
yuhaiin-core = { path = "../yuhaiin-core", features = ["async-proxy"] }
rustls = { version = "0.23.41", optional = true, default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true, default-features = false, features = ["std", "tls12", "zeroize"] }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["tls12"] }
tokio-tungstenite = { version = "0.28.0", optional = true, default-features = false, features = ["handshake"] }

[features]
default = []
tls-rustcrypto = ["dep:rustls", "dep:rustls-rustcrypto", "dep:tokio-rustls"]
websocket = ["dep:futures-util", "dep:tokio-tungstenite", "yuhaiin-core/websocket"]

[dev-dependencies]
rustls-pemfile = "2.2.0"

[lints]
workspace = true
