[workspace]
resolver = "2"
members = [
    "crates/yuhaiin-types",
    "crates/yuhaiin-dns",
    "crates/yuhaiin-core",
    "crates/yuhaiin-tun",
    "crates/yuhaiin-chain",
    "crates/yuhaiin-geo",
    "crates/yuhaiin-protocol",
    "crates/yuhaiin-store",
    "crates/yuhaiin-trie",
    "crates/yuhaiin-wireguard",
    "crates/yuhaiin-backup",
    "crates/yuhaiin-api",
    "crates/yuhaiin-android",
    "crates/yuhaiin-runtime",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

# The workspace is validated repeatedly in a cache-backed target directory.
# Incremental debug/test artifacts grow much faster than the reusable binary
# and dependency artifacts, so keep them disabled for bounded disk usage.
[profile.dev]
incremental = false

[profile.test]
incremental = false

# Keep release artifacts portable while enabling cross-crate optimization.
# Thin LTO provides most of the link-time optimization benefit without the
# build time and memory cost of full LTO. A single codegen unit gives rustc
# more room to optimize hot paths, and symbol stripping keeps distributions
# small. Do not set target-cpu=native here: release artifacts are cross-built
# for multiple platforms and must run on other machines of the same target.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
